version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: bk
    main: .
    ldflags:
      - -s -w
      - -X github.com/ts-suzuki/backlog-cli/cmd.version={{.Version}}
      - -X github.com/ts-suzuki/backlog-cli/cmd.commit={{.Commit}}
      - -X github.com/ts-suzuki/backlog-cli/cmd.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "backlog-cli_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
